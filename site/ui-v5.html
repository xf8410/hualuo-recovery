<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hualuo RepoTool · UI v5（定稿候选）</title>
<style>
:root{
  --bg:#101317; --panel:#171c22; --line:#242c36; --txt:#dfe6ee; --dim:#7d8b9c;
  --acc:#37c8b0; --warn:#e6a23c; --red:#e05c5c; --blue:#5aa2e8;
  --mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px}
.app{width:420px;height:86vh;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header .title{font-weight:700;font-size:13px}
header .ledger{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);background:#0d1116;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
header .ledger b{color:var(--acc)}
header .railbtn{border:1px solid var(--line);background:#0d1116;color:var(--dim);border-radius:6px;width:26px;height:26px;cursor:pointer}
.wrap{display:flex;flex:1;overflow:hidden}
nav{width:30px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:14px;transition:width .15s;overflow:hidden;flex-shrink:0}
nav.open{width:132px;align-items:stretch}
nav a{color:var(--dim);text-decoration:none;font-size:12px;padding:4px 0;text-align:center;white-space:nowrap;cursor:pointer}
nav.collapsed-mode a span{writing-mode:vertical-rl;letter-spacing:4px;padding:6px 0}
nav.open a{writing-mode:horizontal-tb!important;letter-spacing:0;padding:6px 14px;text-align:left}
nav a.on{color:var(--acc)}
main{flex:1;overflow-y:auto;padding:12px}
.card{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;background:var(--panel);padding:10px 12px;margin-bottom:10px}
.card.model{border-left-color:var(--acc)}
.card .who{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim);margin-bottom:6px}
.card .who .tag{font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 6px;background:#0d1116}
.card .body{font-size:13px}
.card .body code{font-family:var(--mono);font-size:12px;background:#0d1116;padding:1px 5px;border-radius:4px;color:var(--acc)}
.drop{font-size:11px;color:var(--warn);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px;cursor:pointer}
.composer{border-top:1px solid var(--line);background:var(--panel);padding:10px}
.composer .row1{display:flex;gap:8px}
.composer input{flex:1;background:#0d1116;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:13px;outline:none}
.composer input:focus{border-color:var(--acc)}
.composer .row2{display:flex;align-items:center;gap:8px;margin-top:8px}
.ibtn{border:1px solid var(--line);background:#0d1116;color:var(--dim);border-radius:8px;height:30px;padding:0 10px;font-size:12px;cursor:pointer}
.mchip{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--acc);color:var(--acc);background:rgba(55,200,176,.08);border-radius:16px;height:30px;padding:0 12px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.send{width:30px;height:30px;border-radius:8px;border:none;background:var(--acc);color:#06231d;font-weight:700;cursor:pointer}
.send.stop{background:var(--red);color:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:12px;transform:translateY(105%);transition:transform .18s;max-height:62%;display:flex;flex-direction:column;z-index:9}
.sheet.open{transform:translateY(0)}
.sheet h4{font-size:12px;color:var(--dim);font-weight:400;margin-bottom:8px}
.sheet .search{width:100%;background:#0d1116;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13px;margin-bottom:8px;outline:none}
.sheet .list{overflow-y:auto}
.grp{font-size:11px;color:var(--dim);margin:8px 0 4px;font-family:var(--mono)}
.mrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#12171d}
.mrow:hover{border-color:var(--acc)}
.mrow .nm{font-size:13px}
.mrow .meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.mrow .cap{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--dim)}
.mrow .cap.no{color:var(--red);border-color:var(--red)}
.mrow.def{border-color:var(--acc)}
.sheet .lock{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);margin-top:8px}
.hint{font-size:11px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="railbtn" id="railBtn" title="展开/收起侧栏">☰</button>
    <div class="title">Hualuo RepoTool</div>
    <div class="ledger">ctx <b id="ctxUsed">21.4k</b>/1M · 发出 <b>856</b> tok</div>
  </header>
  <div class="wrap">
    <nav id="rail" class="collapsed-mode">
      <a class="on">回合流</a><a>长任务</a><a>工具自检</a><a>仓库CI</a><a>观测</a>
    </nav>
    <main>
      <div class="card"><div class="who"><span class="tag">你</span> · 22:47</div>
        <div class="body">右侧要加伸缩按钮，对话里直接切换模型呢？</div></div>
      <div class="card model"><div class="who"><span class="tag">qwen3.8-flash · bai2</span>·<span class="tag">结论</span>·<span class="tag">依据 4</span>·<span class="tag">未验 1</span></div>
        <div class="body">侧栏伸缩已加（点 <code>☰</code>，30px↔132px）；模型切换改到输入框原位——点青色胶囊即弹。<br>弹层内：<code>分组</code> + <code>搜索</code> + 每个模型的<code>真实上限</code>（客户端填的数不算数）。</div>
        <div class="drop">⚠ 本回合丢弃：附件 type 不识别 ×2 · 历史按条裁剪 96 条（点开查看）</div></div>
    </main>
  </div>
  <div class="composer">
    <div class="row1"><input id="inp" placeholder="输入消息，附件自动随消息登记…"></div>
    <div class="row2">
      <button class="ibtn">＋附件</button>
      <button class="ibtn">工具 ✓</button>
      <button class="mchip" id="mchip"><span id="mchipTxt">qwen3.8-flash · bai2 · 1M</span>▾</button>
      <button class="send" id="send">➤</button>
    </div>
    <div class="hint">生成中此键变 <span style="color:var(--red)">■ 停止</span>；被打断后先查幂等标记，已成功不重发。</div>
  </div>

  <div class="sheet" id="sheet">
    <h4>切换模型 · 真实上限以模型报的为准</h4>
    <input class="search" id="ms" placeholder="搜索模型…">
    <div class="list" id="mlist"></div>
    <label class="lock"><input type="checkbox" id="lock"> 锁定到本会话（不勾则仅影响下一条）</label>
  </div>
</div>
<script>
const models=[
 {g:"bai2 网关",n:"qwen3.8-flash",ctx:"1M",tool:1,vis:1,def:1},
 {g:"bai2 网关",n:"qwen3-max",ctx:"256k",tool:1,vis:0},
 {g:"官方 API",n:"gpt-4o-mini",ctx:"128k",tool:1,vis:1},
 {g:"官方 API",n:"claude-sonnet",ctx:"200k",tool:1,vis:1},
 {g:"本地 ollama",n:"qwen2.5-coder:32b",ctx:"32k",tool:0,vis:0}
];
const $=id=>document.getElementById(id);
$("railBtn").onclick=()=>$("rail").classList.toggle("open");
$("mchip").onclick=()=>$("sheet").classList.toggle("open");
function render(q=""){
 $("mlist").innerHTML=models.filter(m=>m.n.includes(q)).map((m)=>`
  <div class="mrow ${m.def?"def":""}" data-n="${m.n}" data-ctx="${m.ctx}">
    <div><div class="grp">${m.g}</div>${m.n}${m.def?' <span class="cap" style="color:var(--acc)">默认</span>':""}</div>
    <span class="meta">ctx ${m.ctx}</span>
    <span class="cap">工具${m.tool?"✓":'<span class="cap no">✗</span>'}</span>
    <span class="cap">视觉${m.vis?"✓":'<span class="cap no">✗</span>'}</span>
  </div>`).join("");
 document.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{
   $("mchipTxt").textContent=r.dataset.n+" · "+r.dataset.ctx;
   $("sheet").classList.remove("open");
   $("ctxUsed").textContent="0.0k";
 });
}
render(); $("ms").oninput=e=>render(e.target.value.trim());
let busy=false;
$("send").onclick=()=>{busy=!busy;const b=$("send");b.textContent=busy?"■":"➤";b.classList.toggle("stop",busy);if(!busy)$("ctxUsed").textContent="22.1k";};
</script>
</body>
</html>
